<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Quality Analyzer Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-button {
            flex: 1;
            padding: 12px;
            border: none;
            background: #f0f0f0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-button.active {
            background: #667eea;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .input-group input[type="text"],
        .input-group input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .analyze-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .analyze-button:active {
            transform: scale(0.98);
        }

        .analyze-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            display: none;
        }

        .result.active {
            display: block;
        }

        .score-display {
            text-align: center;
            padding: 30px;
            margin-bottom: 20px;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
        }

        .score-S { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .score-A { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .score-B { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .score-C { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .score-D { background: linear-gradient(135deg, #e52d27 0%, #b31217 100%); }

        .grade-label {
            font-size: 18px;
            color: #666;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .category-scores {
            margin-bottom: 20px;
        }

        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .category-item:last-child {
            border-bottom: none;
        }

        .category-name {
            font-weight: 600;
            color: #333;
        }

        .category-score {
            font-weight: bold;
            color: #667eea;
        }

        .issue-list {
            margin-top: 20px;
        }

        .issue-item {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid;
        }

        .issue-critical {
            background: #fee;
            border-color: #e53e3e;
        }

        .issue-high {
            background: #fff5e6;
            border-color: #ff9800;
        }

        .issue-medium {
            background: #fff9e6;
            border-color: #ffd700;
        }

        .issue-low {
            background: #e6f7ff;
            border-color: #2196f3;
        }

        .issue-title {
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }

        .issue-description {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .issue-fix {
            font-size: 13px;
            color: #444;
            background: white;
            padding: 8px;
            border-radius: 4px;
            margin-top: 8px;
        }

        .download-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .download-button {
            flex: 1;
            padding: 12px;
            background: #f0f0f0;
            color: #333;
            text-decoration: none;
            text-align: center;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .download-button:hover {
            background: #e0e0e0;
        }

        .error {
            background: #fee;
            color: #c53030;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .error.active {
            display: block;
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 24px;
            }

            .card {
                padding: 16px;
            }

            .score-circle {
                width: 120px;
                height: 120px;
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Web Quality Analyzer Pro</h1>
            <p>世界最高水準のWebサイト品質分析ツール</p>
        </div>

        <div class="card">
            <div class="tab-buttons">
                <button class="tab-button active" onclick="switchTab('url')">URL分析</button>
                <button class="tab-button" onclick="switchTab('file')">ファイル分析</button>
                <button class="tab-button" onclick="switchTab('design')">🎨 デザイン比較</button>
            </div>

            <!-- URL分析タブ -->
            <div id="url-tab" class="tab-content active">
                <div class="input-group">
                    <label for="url-input">分析するURL</label>
                    <input type="text" id="url-input" placeholder="https://example.com">
                </div>
                <button class="analyze-button" onclick="analyzeUrl()">分析開始</button>
            </div>

            <!-- ファイル分析タブ -->
            <div id="file-tab" class="tab-content">
                <div class="input-group">
                    <label for="file-input">HTMLファイルを選択</label>
                    <input type="file" id="file-input" accept=".html,.htm">
                </div>
                <button class="analyze-button" onclick="analyzeFile()">分析開始</button>
            </div>

            <!-- デザイン比較タブ -->
            <div id="design-tab" class="tab-content">
                <div style="background: #f0f9ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #2196f3;">
                    <strong>🚀 世界初！</strong> デザインカンプ（PDF）と実装をピクセル単位で自動比較
                </div>

                <!-- 比較方法の選択 -->
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 10px; font-weight: 600; color: #333;">比較方法を選択</label>
                    <div style="display: flex; gap: 20px;">
                        <label style="display: flex; align-items: center; cursor: pointer;">
                            <input type="radio" name="compare-mode" value="html" checked onchange="toggleCompareMode()">
                            <span style="margin-left: 8px;">HTMLファイルと比較</span>
                        </label>
                        <label style="display: flex; align-items: center; cursor: pointer;">
                            <input type="radio" name="compare-mode" value="url" onchange="toggleCompareMode()">
                            <span style="margin-left: 8px;">サイトURLと比較</span>
                        </label>
                    </div>
                </div>

                <div class="input-group">
                    <label for="pdf-input">📄 デザインカンプ（PDF）</label>
                    <input type="file" id="pdf-input" accept=".pdf">
                </div>

                <!-- HTMLファイル入力 -->
                <div class="input-group" id="html-input-group">
                    <label for="html-input">💻 実装ファイル（HTML）</label>
                    <input type="file" id="html-input" accept=".html,.htm">
                </div>

                <!-- URL入力 -->
                <div class="input-group" id="url-input-group" style="display: none;">
                    <label for="design-url-input">🌐 比較するサイトのURL</label>
                    <input type="text" id="design-url-input" placeholder="https://example.com">
                </div>

                <button class="analyze-button" onclick="compareDesign()">🎯 デザイン比較を開始</button>
            </div>

            <!-- ローディング表示 -->
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>分析中...</p>
            </div>

            <!-- エラー表示 -->
            <div id="error" class="error"></div>
        </div>

        <!-- 分析結果 -->
        <div id="result" class="result">
            <div class="card">
                <div class="score-display">
                    <div id="score-circle" class="score-circle">
                        <span id="score-text">--</span>
                    </div>
                    <div class="grade-label">総合グレード: <span id="grade">-</span></div>
                    <div class="score-value"><span id="total-score">--</span> / 100</div>
                </div>

                <div class="category-scores" id="category-scores">
                    <!-- カテゴリ別スコアが動的に追加されます -->
                </div>

                <div class="download-buttons">
                    <a id="download-md" href="#" class="download-button">📄 Markdown</a>
                    <a id="download-json" href="#" class="download-button">📊 JSON</a>
                </div>
            </div>

            <!-- サマリー情報カード -->
            <div class="card" id="summary-card">
                <h3 style="margin-bottom: 15px;">📈 サイト概要</h3>
                <div id="summary-list">
                    <!-- サマリー情報が動的に追加されます -->
                </div>
            </div>

            <!-- 優先対応事項カード -->
            <div class="card" id="recommendations-card" style="display: none;">
                <h3 style="margin-bottom: 15px;">🎯 優先的に対応すべき項目</h3>
                <div id="recommendations-list">
                    <!-- 推奨事項が動的に追加されます -->
                </div>
            </div>

            <div class="card">
                <h3 style="margin-bottom: 15px;">⚠️ 検出された問題 <span id="issue-count" style="background: #ff9800; color: white; padding: 2px 10px; border-radius: 12px; font-size: 14px; margin-left: 10px;">0</span></h3>
                <div id="issue-list" class="issue-list">
                    <!-- 問題一覧が動的に追加されます -->
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            // タブボタンの切り替え
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // タブコンテンツの切り替え
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(tab + '-tab').classList.add('active');

            // エラーと結果をクリア
            hideError();
            hideResult();
        }

        function showLoading() {
            document.getElementById('loading').classList.add('active');
            document.querySelectorAll('.analyze-button').forEach(btn => {
                btn.disabled = true;
            });
        }

        function hideLoading() {
            document.getElementById('loading').classList.remove('active');
            document.querySelectorAll('.analyze-button').forEach(btn => {
                btn.disabled = false;
            });
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
        }

        function hideError() {
            document.getElementById('error').classList.remove('active');
        }

        function showResult() {
            document.getElementById('result').classList.add('active');
        }

        function hideResult() {
            document.getElementById('result').classList.remove('active');
        }

        async function analyzeUrl() {
            const url = document.getElementById('url-input').value.trim();

            if (!url) {
                showError('URLを入力してください');
                return;
            }

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                showError('URLは http:// または https:// で始まる必要があります');
                return;
            }

            hideError();
            hideResult();
            showLoading();

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                if (data.success) {
                    displayResult(data.report, data.download_links);
                } else {
                    showError(data.error || '分析に失敗しました');
                }
            } catch (error) {
                showError('サーバーとの通信に失敗しました: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        async function analyzeFile() {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];

            if (!file) {
                showError('ファイルを選択してください');
                return;
            }

            hideError();
            hideResult();
            showLoading();

            try {
                const formData = new FormData();
                formData.append('file', file);

                const response = await fetch('/api/analyze-file', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    displayResult(data.report, data.download_links);
                } else {
                    showError(data.error || '分析に失敗しました');
                }
            } catch (error) {
                showError('サーバーとの通信に失敗しました: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        function displayResult(report, downloadLinks) {
            // スコア表示
            const scoreCircle = document.getElementById('score-circle');
            const scoreText = document.getElementById('score-text');
            const gradeText = document.getElementById('grade');
            const totalScoreText = document.getElementById('total-score');

            scoreText.textContent = report.total_score;
            gradeText.textContent = report.grade;
            totalScoreText.textContent = report.total_score;

            // グレードに応じた色設定
            scoreCircle.className = 'score-circle score-' + report.grade;

            // カテゴリ別スコア表示
            const categoryScoresDiv = document.getElementById('category-scores');
            categoryScoresDiv.innerHTML = '';

            const categoryEmojis = {
                'SEO': '🔍',
                'アクセシビリティ': '♿',
                'パフォーマンス': '⚡',
                'デザイン': '🎨',
                'セキュリティ': '🔒',
                'コード品質': '💻'
            };

            for (const [category, score] of Object.entries(report.category_scores)) {
                const item = document.createElement('div');
                item.className = 'category-item';
                item.innerHTML = `
                    <span class="category-name">${categoryEmojis[category] || ''} ${category}</span>
                    <span class="category-score">${score}/100</span>
                `;
                categoryScoresDiv.appendChild(item);
            }

            // 問題一覧表示
            const issueListDiv = document.getElementById('issue-list');
            issueListDiv.innerHTML = '';

            // 問題数の表示
            document.getElementById('issue-count').textContent = report.issues.length;

            if (report.issues.length === 0) {
                issueListDiv.innerHTML = '<p style="text-align: center; color: #666;">✅ 問題は検出されませんでした！完璧です！</p>';
                document.getElementById('issue-count').style.background = '#4caf50';
            } else {
                // 重要度順にソート
                const severityOrder = { 'critical': 0, 'high': 1, 'medium': 2, 'low': 3 };
                const sortedIssues = report.issues.sort((a, b) =>
                    severityOrder[a.severity] - severityOrder[b.severity]
                );

                sortedIssues.forEach(issue => {
                    const item = document.createElement('div');
                    item.className = `issue-item issue-${issue.severity}`;

                    const severityLabels = {
                        'critical': '🔴 致命的',
                        'high': '🟠 重要',
                        'medium': '🟡 中程度',
                        'low': '🟢 軽微'
                    };

                    item.innerHTML = `
                        <div style="font-size: 12px; color: #888; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
                            <span>${severityLabels[issue.severity]} | ${issue.category}</span>
                            <span style="background: rgba(0,0,0,0.05); padding: 2px 8px; border-radius: 12px; font-size: 10px;">-${issue.severity === 'critical' ? '15' : issue.severity === 'high' ? '10' : issue.severity === 'medium' ? '5' : '2'}点</span>
                        </div>
                        <div class="issue-title">${issue.title}</div>
                        <div class="issue-description" style="margin-bottom: 8px;"><strong>❓ 問題:</strong> ${issue.description}</div>
                        <div style="background: #fff9e6; padding: 10px; border-radius: 4px; margin-bottom: 8px; border-left: 3px solid #ff9800;">
                            <strong>⚠️ ビジネスへの影響:</strong> ${issue.impact}
                        </div>
                        <div class="issue-fix"><strong>✅ 修正方法:</strong> ${issue.fix}</div>
                        ${issue.element ? `<div style="margin-top: 8px; font-size: 12px; color: #666;"><strong>📍 該当箇所:</strong> <code style="background: #f5f5f5; padding: 2px 6px; border-radius: 3px;">${issue.element.substring(0, 100)}...</code></div>` : ''}
                    `;
                    issueListDiv.appendChild(item);
                });
            }

            // 推奨事項の表示
            if (report.recommendations && report.recommendations.length > 0) {
                const recommendationsDiv = document.getElementById('recommendations-list');
                recommendationsDiv.innerHTML = '';
                recommendationsDiv.parentElement.style.display = 'block';

                report.recommendations.forEach((rec, index) => {
                    const recItem = document.createElement('div');
                    recItem.style.cssText = 'padding: 12px; background: #f0f9ff; border-left: 4px solid #2196f3; border-radius: 4px; margin-bottom: 10px;';
                    recItem.innerHTML = `<strong>${index + 1}.</strong> ${rec}`;
                    recommendationsDiv.appendChild(recItem);
                });
            } else {
                document.getElementById('recommendations-list').parentElement.style.display = 'none';
            }

            // サマリー情報の表示
            if (report.summary) {
                const summaryDiv = document.getElementById('summary-list');
                summaryDiv.innerHTML = '';
                summaryDiv.parentElement.style.display = 'block';

                for (const [key, value] of Object.entries(report.summary)) {
                    const summaryItem = document.createElement('div');
                    summaryItem.style.cssText = 'display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0;';
                    summaryItem.innerHTML = `
                        <span style="color: #666;">${key}</span>
                        <span style="font-weight: 600; color: #333;">${value}</span>
                    `;
                    summaryDiv.appendChild(summaryItem);
                }
            }

            // ダウンロードリンク設定
            document.getElementById('download-md').href = downloadLinks.markdown;
            document.getElementById('download-json').href = downloadLinks.json;

            showResult();
        }

        function toggleCompareMode() {
            const mode = document.querySelector('input[name="compare-mode"]:checked').value;
            const htmlInputGroup = document.getElementById('html-input-group');
            const urlInputGroup = document.getElementById('url-input-group');

            if (mode === 'html') {
                htmlInputGroup.style.display = 'block';
                urlInputGroup.style.display = 'none';
            } else {
                htmlInputGroup.style.display = 'none';
                urlInputGroup.style.display = 'block';
            }
        }

        async function compareDesign() {
            const pdfInput = document.getElementById('pdf-input');
            const pdfFile = pdfInput.files[0];

            if (!pdfFile) {
                showError('PDFファイル（デザインカンプ）を選択してください');
                return;
            }

            const mode = document.querySelector('input[name="compare-mode"]:checked').value;
            const formData = new FormData();
            formData.append('pdf_file', pdfFile);

            let endpoint;
            if (mode === 'html') {
                const htmlFile = document.getElementById('html-input').files[0];
                if (!htmlFile) {
                    showError('HTMLファイル（実装）を選択してください');
                    return;
                }
                formData.append('html_file', htmlFile);
                endpoint = '/api/compare-design';
            } else {
                const url = document.getElementById('design-url-input').value.trim();
                if (!url) {
                    showError('URLを入力してください');
                    return;
                }
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    showError('URLは http:// または https:// で始まる必要があります');
                    return;
                }
                formData.append('url', url);
                endpoint = '/api/compare-design-url';
            }

            hideError();
            hideResult();
            showLoading();
            document.getElementById('loading').querySelector('p').textContent = 'デザイン比較中...（最大30秒程度かかります）';

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    displayDesignResult(data.result);
                } else {
                    showError(data.error || 'デザイン比較に失敗しました');
                }
            } catch (error) {
                showError('サーバーとの通信に失敗しました: ' + error.message);
            } finally {
                hideLoading();
                document.getElementById('loading').querySelector('p').textContent = '分析中...';
            }
        }

        function displayDesignResult(result) {
            // スコア表示
            const scoreCircle = document.getElementById('score-circle');
            const scoreText = document.getElementById('score-text');
            const gradeText = document.getElementById('grade');
            const totalScoreText = document.getElementById('total-score');

            scoreText.textContent = Math.round(result.similarity_score);
            gradeText.textContent = result.grade;
            totalScoreText.textContent = Math.round(result.similarity_score);

            // グレードに応じた色設定
            scoreCircle.className = 'score-circle score-' + result.grade;

            // カテゴリ別スコアは非表示（デザイン比較では使わない）
            const categoryScoresDiv = document.getElementById('category-scores');
            categoryScoresDiv.innerHTML = `
                <div style="text-align: center; padding: 20px; background: #f5f5f5; border-radius: 8px;">
                    <div style="font-size: 14px; color: #666; margin-bottom: 10px;">デザイン再現率</div>
                    <div style="font-size: 32px; font-weight: bold; color: #667eea;">${result.similarity_score.toFixed(2)}%</div>
                    <div style="font-size: 12px; color: #888; margin-top: 5px;">差分: ${result.diff_percentage.toFixed(2)}% (${result.pixel_difference.toLocaleString()} / ${result.total_pixels.toLocaleString()} ピクセル)</div>
                </div>
            `;

            // サマリーは非表示
            document.getElementById('summary-card').style.display = 'none';

            // 推奨事項は非表示
            document.getElementById('recommendations-card').style.display = 'none';

            // 問題一覧表示
            const issueListDiv = document.getElementById('issue-list');
            issueListDiv.innerHTML = '';

            // 問題数の表示
            document.getElementById('issue-count').textContent = result.issues.length;

            if (result.issues.length === 0) {
                issueListDiv.innerHTML = '<p style="text-align: center; color: #666;">✅ デザインは完璧に再現されています！</p>';
                document.getElementById('issue-count').style.background = '#4caf50';
            } else {
                // 重要度順にソート
                const severityOrder = { 'critical': 0, 'high': 1, 'medium': 2, 'low': 3 };
                const sortedIssues = result.issues.sort((a, b) =>
                    severityOrder[a.severity] - severityOrder[b.severity]
                );

                sortedIssues.forEach(issue => {
                    const item = document.createElement('div');
                    item.className = `issue-item issue-${issue.severity}`;

                    const severityLabels = {
                        'critical': '🔴 致命的',
                        'high': '🟠 重要',
                        'medium': '🟡 中程度',
                        'low': '🟢 軽微'
                    };

                    item.innerHTML = `
                        <div style="font-size: 12px; color: #888; margin-bottom: 8px;">
                            <span>${severityLabels[issue.severity]} | デザイン品質</span>
                        </div>
                        <div class="issue-title">${issue.title}</div>
                        <div class="issue-description" style="margin-bottom: 8px;"><strong>❓ 問題:</strong> ${issue.description}</div>
                        <div style="background: #fff9e6; padding: 10px; border-radius: 4px; margin-bottom: 8px; border-left: 3px solid #ff9800;">
                            <strong>⚠️ ビジネスへの影響:</strong> ${issue.impact}
                        </div>
                        <div class="issue-fix"><strong>✅ 修正方法:</strong> ${issue.fix}</div>
                    `;
                    issueListDiv.appendChild(item);
                });
            }

            // 高度な分析結果カードを追加
            if (result.section_analyses || result.color_palette_score || result.layout_accuracy || result.css_recommendations) {
                const advancedAnalysisCard = document.createElement('div');
                advancedAnalysisCard.className = 'card';
                let advancedHTML = '<h3 style="margin-bottom: 15px;">🎯 高度なCSS分析結果</h3>';

                // セクション別分析
                if (result.section_analyses && result.section_analyses.length > 0) {
                    advancedHTML += '<div style="margin-bottom: 20px;"><h4 style="margin-bottom: 10px; color: #667eea;">📊 セクション別再現率</h4>';
                    result.section_analyses.forEach(section => {
                        const barColor = section.similarity_score >= 95 ? '#4caf50' : section.similarity_score >= 90 ? '#667eea' : section.similarity_score >= 80 ? '#ff9800' : '#e53e3e';
                        advancedHTML += `
                            <div style="margin-bottom: 15px;">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                                    <span style="font-weight: 600;">${section.section_name}</span>
                                    <span style="color: ${barColor}; font-weight: bold;">${section.similarity_score.toFixed(1)}%</span>
                                </div>
                                <div style="background: #f0f0f0; height: 8px; border-radius: 4px; overflow: hidden;">
                                    <div style="background: ${barColor}; height: 100%; width: ${section.similarity_score}%; transition: width 0.3s;"></div>
                                </div>
                            </div>
                        `;
                    });
                    advancedHTML += '</div>';
                }

                // カラーパレット・レイアウト精度
                if (result.color_palette_score !== null || result.layout_accuracy !== null) {
                    advancedHTML += '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">';

                    if (result.color_palette_score !== null) {
                        const colorScore = result.color_palette_score;
                        const colorBarColor = colorScore >= 85 ? '#4caf50' : colorScore >= 70 ? '#ff9800' : '#e53e3e';
                        advancedHTML += `
                            <div style="background: #f9f9f9; padding: 15px; border-radius: 8px; text-align: center;">
                                <div style="font-size: 12px; color: #666; margin-bottom: 5px;">🎨 カラーパレット一致度</div>
                                <div style="font-size: 24px; font-weight: bold; color: ${colorBarColor};">${colorScore.toFixed(1)}%</div>
                            </div>
                        `;
                    }

                    if (result.layout_accuracy !== null) {
                        const layoutScore = result.layout_accuracy;
                        const layoutBarColor = layoutScore >= 85 ? '#4caf50' : layoutScore >= 70 ? '#ff9800' : '#e53e3e';
                        advancedHTML += `
                            <div style="background: #f9f9f9; padding: 15px; border-radius: 8px; text-align: center;">
                                <div style="font-size: 12px; color: #666; margin-bottom: 5px;">📐 レイアウト精度</div>
                                <div style="font-size: 24px; font-weight: bold; color: ${layoutBarColor};">${layoutScore.toFixed(1)}%</div>
                            </div>
                        `;
                    }

                    advancedHTML += '</div>';
                }

                // CSS修正提案
                if (result.css_recommendations && result.css_recommendations.length > 0) {
                    advancedHTML += '<div style="margin-bottom: 20px;"><h4 style="margin-bottom: 10px; color: #667eea;">💡 具体的なCSS修正提案</h4>';
                    result.css_recommendations.forEach((rec, index) => {
                        advancedHTML += `
                            <div style="background: #fff9e6; padding: 12px; margin-bottom: 8px; border-radius: 4px; border-left: 3px solid #ff9800;">
                                <strong>${index + 1}.</strong> ${rec}
                            </div>
                        `;
                    });
                    advancedHTML += '</div>';
                }

                // ヒートマップ
                if (result.heatmap) {
                    advancedHTML += `
                        <div>
                            <h4 style="margin-bottom: 10px; color: #667eea;">🔥 差分ヒートマップ</h4>
                            <p style="font-size: 12px; color: #666; margin-bottom: 10px;">青=一致、赤=差分が大きい</p>
                            <img src="data:image/png;base64,${result.heatmap}" style="width: 100%; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                        </div>
                    `;
                }

                advancedAnalysisCard.innerHTML = advancedHTML;

                // 結果カードの後に追加
                const resultDiv = document.getElementById('result');
                const issueCard = resultDiv.querySelector('.card:last-child');
                issueCard.parentNode.insertBefore(advancedAnalysisCard, issueCard);
            }

            // 画像比較カードを追加
            const imageComparisonCard = document.createElement('div');
            imageComparisonCard.className = 'card';
            imageComparisonCard.innerHTML = `
                <h3 style="margin-bottom: 15px;">🖼️ 視覚的比較</h3>

                <div style="margin-bottom: 20px;">
                    <h4 style="margin-bottom: 10px; color: #667eea;">📄 デザインカンプ（PDF）</h4>
                    <img src="data:image/png;base64,${result.design_image}" style="width: 100%; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                </div>

                <div style="margin-bottom: 20px;">
                    <h4 style="margin-bottom: 10px; color: #667eea;">💻 実装（ブラウザ表示）</h4>
                    <img src="data:image/png;base64,${result.browser_image}" style="width: 100%; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                </div>

                <div style="margin-bottom: 20px;">
                    <h4 style="margin-bottom: 10px; color: #e53e3e;">🔴 差分検出（赤色 = 違う部分）</h4>
                    <img src="data:image/png;base64,${result.diff_image}" style="width: 100%; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                </div>

                <div>
                    <h4 style="margin-bottom: 10px; color: #ff9800;">🎯 オーバーレイ表示</h4>
                    <img src="data:image/png;base64,${result.overlay_image}" style="width: 100%; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                </div>
            `;

            // 既存の結果カードの後に画像比較カードを追加
            const resultDiv = document.getElementById('result');
            const issueCard = resultDiv.querySelector('.card:last-child');
            issueCard.parentNode.insertBefore(imageComparisonCard, issueCard);

            // ダウンロードボタンは非表示
            document.querySelectorAll('.download-buttons').forEach(el => el.style.display = 'none');

            showResult();
        }
    </script>
</body>
</html>
